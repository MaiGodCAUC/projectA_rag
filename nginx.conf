# ============================================================
# 国航内部员工智能知识助手 - Nginx 反向代理配置
#
# 路由规则:
#   /api/*     → FastAPI (:8000)    — 后端 API
#   /docs      → FastAPI (:8000)    — Swagger 文档
#   /redoc     → FastAPI (:8000)    — ReDoc 文档
#   /openapi.json → FastAPI (:8000) — OpenAPI Schema
#   /health    → FastAPI (:8000)    — 健康检查
#   /*         → Streamlit (:8501)  — 前端工作台
# ============================================================

upstream api_backend {
    server api:8000;
}

upstream streamlit_frontend {
    server streamlit:8501;
}

server {
    listen 80;
    server_name localhost;

    # 上传文件大小限制（文档可能较大）
    client_max_body_size 50M;

    # =========================================================================
    # FastAPI 后端
    # =========================================================================
    location /api/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # SSE 流式输出支持
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Swagger / OpenAPI
    location /docs {
        proxy_pass http://api_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /redoc {
        proxy_pass http://api_backend/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 健康检查
    location /health {
        proxy_pass http://api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # Streamlit 前端（默认路由）
    # =========================================================================
    location / {
        proxy_pass http://streamlit_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # Streamlit 需要 WebSocket 支持
        proxy_set_header Origin http://streamlit_frontend;
    }

    # Streamlit 静态资源
    location /_stcore/ {
        proxy_pass http://streamlit_frontend/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
